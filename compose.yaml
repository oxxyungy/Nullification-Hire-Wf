services:
  postgres:
    image: postgres:16-alpine
    container_name: nullification-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-nullification}
      POSTGRES_USER: ${DB_USERNAME:-nullification}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nullification}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
